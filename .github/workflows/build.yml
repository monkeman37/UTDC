name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build texinfo flex bison \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libelf-dev gcc-mingw-w64-x86-64 python3

      - name: Cache KallistiOS toolchain
        id: cache-kos
        uses: actions/cache@v4
        with:
          path: /opt/toolchains/dc
          key: kos-${{ runner.os }}-${{ hashFiles('toolchain/build-toolchain.sh', 'toolchain/patches/**') }}

      - name: Build KallistiOS toolchain
        if: steps.cache-kos.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/toolchains/dc && sudo chown -R "$USER" /opt/toolchains
          JOBS=$(nproc) toolchain/build-toolchain.sh

      - name: Build Dreamcast runner
        run: scripts/build-runner.sh

      - name: Build builder (Linux CLI)
        run: |
          cmake -S builder -B builder/build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
          ninja -C builder/build-linux

      - name: Build wizard (Windows)
        run: |
          cmake -S builder -B builder/build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake
          ninja -C builder/build-win

      - name: Package
        run: |
          mkdir -p dist
          cp builder/build-win/UTDC-Wizard.exe builder/build-win/utdc-builder-cli.exe dist/
          cp builder/build-linux/utdc-builder-cli dist/utdc-builder-cli-linux
          cp runner/build-dc/1ST_READ.BIN runner/build-dc/IP.BIN dist/
          cp README.md LICENSE THIRD_PARTY.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: utdc
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UTDC-Wizard.exe
            dist/utdc-builder-cli.exe
            dist/utdc-builder-cli-linux
            dist/1ST_READ.BIN
            dist/IP.BIN
